<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDoS防御博弈策略展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }

        .box-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .box {
            flex: 1;
            min-width: 300px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .box:hover {
            transform: translateY(-10px);
        }

        .box-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .box-content {
            padding: 20px;
        }

        .box-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #333;
        }

        .box-text {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .box-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .box-button:hover {
            background-color: #45a049;
        }

        @media (max-width: 768px) {
            .box-container {
                flex-direction: column;
            }

            .box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">网络选择</h1>

        <div class="box-container">
            <!-- 第一个框 -->
            <div class="box">
                <h2>IP网络</h2>
                <img src="" alt="放IP网络的图" class="box-image">
                <div class="box-content">
                    <h2 class="box-title">防御者静态过滤博弈</h2>
                    <p class="box-text">利用静态博弈决定DDoS过滤策略</p>
                    <a href="/IP" class="box-button">了解更多</a>
                </div>
            </div>

            <!-- 第二个框 -->
            <div class="box">
                <h2>5G网络</h2>
                <img src="" alt="放5G网络的图" class="box-image">
                <div class="box-content">
                    <h2 class="box-title">动态攻防博弈</h2>
                    <p class="box-text">利用攻防动态博弈分析双方收益</p>
                    <a href="/5G" class="box-button">了解更多</a>
                </div>
            </div>

            <!-- 第三个框 -->
            <div class="box">
                <h2>卫星网络</h2>
                <img src="" alt="放卫星网络的图" class="box-image">
                <div class="box-content">
                    <h2 class="box-title">平均场动态博弈</h2>
                    <p class="box-text">利用平均场博弈动态决定防御资源分配</p>
                    <a href="/sate" class="box-button">了解更多</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
